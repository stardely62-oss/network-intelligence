[workspace]
resolver = "2"
members = [
  "crates/ni-core",
  "crates/ni-windows",
  "crates/ni-probe",
  "crates/ni-collector",
  "crates/ni-diagnostics",
  "crates/ni-storage",
  "crates/ni-report",
  "apps/desktop/src-tauri",
]
# The desktop app needs Tauri/WebView2; core crates build and test anywhere.
default-members = [
  "crates/ni-core",
  "crates/ni-windows",
  "crates/ni-probe",
  "crates/ni-collector",
  "crates/ni-diagnostics",
  "crates/ni-storage",
  "crates/ni-report",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/stardely62-oss/network-intelligence"
rust-version = "1.88"

[workspace.dependencies]
ni-core = { path = "crates/ni-core" }
ni-windows = { path = "crates/ni-windows" }
ni-probe = { path = "crates/ni-probe" }
ni-collector = { path = "crates/ni-collector" }
ni-diagnostics = { path = "crates/ni-diagnostics" }
ni-storage = { path = "crates/ni-storage" }
ni-report = { path = "crates/ni-report" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
